name: Release

# Runs when a v* tag is pushed by hand, or is called by auto-release.yml after it
# tags a version bump on main (tags pushed with GITHUB_TOKEN don't trigger tag
# workflows, so the auto path must call this one directly).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.backend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.frontend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            Container images for `${{ steps.meta.outputs.version }}`:
            - `${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.version }}`
            - `${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.version }}`
