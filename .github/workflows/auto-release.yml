name: Auto Release

# Every commit bumps the SemVer version (backend/app/__init__.py). On each push to
# main, tag the new version if its tag doesn't exist yet, then run the Release
# workflow (build + push GHCR images, create the GitHub Release).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect version and create tag
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "Could not read __version__ from backend/app/__init__.py" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & publish
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
