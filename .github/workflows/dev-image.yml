name: Dev Image

# Every push to dev runs the full CI suite (reusable call into ci.yml) and,
# only when it passes, publishes a prerelease container image to GHCR tagged
# :dev plus :dev-<short sha>, so branch work can be tested in Docker before
# merging to main. No git tag and no GitHub Release are created here —
# auto-release.yml on main stays the only release path, and :latest is never
# touched.
#
# This is a push-triggered workflow (not workflow_run like auto-release.yml)
# because workflow_run workflows only execute from the default branch's copy,
# which would make dev-only changes to this file untestable.

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push dev image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "shatag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:dev
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.shatag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
