[project]
name = "unbound-backend"
version = "0.13.4"
description = "Unbound — self-hosted Audible library manager (Libation-style), REST API + web UI"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "sse-starlette>=2.1",
    "audible>=0.10.0",
    "mutagen>=1.47",
    "apprise>=1.8",
    "pyotp>=2.9",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set to ruff's pre-0.17 defaults. CI installs the latest ruff, and
# 0.17 expanded the defaults (B008 on FastAPI Depends defaults, import sorting,
# RUF100, …), which flagged the whole codebase and broke the lint step.
select = ["E4", "E7", "E9", "F"]
