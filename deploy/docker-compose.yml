# Unbound — self-hosted Audible library manager.
# Single image: FastAPI serves both the API (+ in-process worker) and the web UI.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  unbound:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SECRET_KEY should come from .env; a random one is generated & persisted to
      # /data/secret.key if unset, but set it explicitly for production.
      UNBOUND_DATA_DIR: /data
      UNBOUND_DATABASE_URL: sqlite:////data/unbound.db
      # Behind a TLS reverse proxy keep secure cookies; for plain-HTTP LAN
      # testing set UNBOUND_COOKIE_SECURE=false in .env.
    volumes:
      - unbound_data:/data
      # The decrypted library is written to /data/library inside the container. Bind-mount
      # the host directory (or an already-mounted NAS path) where your library should live —
      # set UNBOUND_LIBRARY_HOST_PATH in .env. It must exist with permissions the container
      # can write. Point your library profile's root at a path under /data/library.
      - ${UNBOUND_LIBRARY_HOST_PATH:-./library}:/data/library
    ports:
      - "${UNBOUND_HTTP_PORT:-8080}:8000"

volumes:
  # App data (SQLite DB, encryption key, logs, temp downloads). The library itself is a
  # host bind mount (see above), not a managed volume.
  unbound_data:
